name: Inceptive
description: Inceptive is an AI biotechnology company founded in 2021 by transformer co-author Jakob
  Uszkoreit and Stanford biochemist Rhiju Das, building foundation models of life to rationally design
  sequence-based medicines such as mRNA, siRNA, ASOs, and peptides. The company pairs large-scale deep
  learning with high-throughput in-house wet-lab experiments in a tight design-build-test loop, then
  licenses successful molecules to pharmaceutical partners. Inceptive is headquartered in Palo Alto with
  offices in Berlin and Zurich, is backed by a16z Bio + Health, Obvious Ventures, NVentures (NVIDIA),
  and S32, and has announced strategic collaborations including a multi-year agreement with Alnylam
  Pharmaceuticals. Inceptive is a research-partner biotech and does not currently publish a public API,
  developer portal, SDK, or documentation surface.
